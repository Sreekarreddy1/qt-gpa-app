apiVersion: apps/v1
kind: Deployment
metadata: { name: gpa-server }
spec:
  replicas: 1
  selector: { matchLabels: { app: gpa-server } }
  template:
    metadata: { labels: { app: gpa-server } }
    spec:
      containers:
      - name: gpa-server
        image: gpa-server:1.0
        imagePullPolicy: Never
        ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata: { name: gpa-server }
spec:
  selector: { app: gpa-server }
  ports: [{ port: 5000, targetPort: 5000 }]